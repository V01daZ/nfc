<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слушай</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #play-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #2c3e50;
    color: white;
    font-size: 24px;
    font-family: Arial, sans-serif;
    border: none;
    cursor: pointer;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s;
  }

  #play-overlay:hover {
    background-color: #34495e;
  }
</style>
</head>
<body>

<button id="play-overlay">🕊️</button>

<h1 style="text-align: center; margin-top: 100px;">MPA VPN ЛУЧШИЙ ВПН ДЛЯ ТВОИХ УСТРОЙСТВ!</h1>

<script>
  const playButton = document.getElementById('play-overlay');
  
  playButton.addEventListener('click', function() {
    const audio = new Audio('sound.mp3');
    audio.play();
    playButton.style.display = 'none';
  });
</script>

</body>
</html>
